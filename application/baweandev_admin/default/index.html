<!DOCTYPE html>
<html>
<head>
  <title>Kontrol Lampu ESP32</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 50px; }
    button {
      width: 100px;
      height: 50px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>KONTROL LAMPU ESP32</h1>
  <button onclick="kirimPerintah('on')">HIDUP</button>
  <button onclick="kirimPerintah('off')">MATI</button>

  <script>
    function kirimPerintah(perintah) {
      fetch('/lampu?status=' + perintah)
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(err => alert("Gagal mengirim perintah: " + err));
    }
  </script>
</body>
</html>
